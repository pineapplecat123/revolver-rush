<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#14161d">
<title>子弹数据</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<div class="wrap">
  <section id="gate">
    <div class="card">
      <h1>子弹数据</h1>
      <p class="sub">输入口令后使用</p>
      <form id="gateForm" autocomplete="off">
        <label for="pin">口令</label>
        <input id="pin" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
        <div id="pinErr" class="hint warn hidden">口令不对，再试一次</div>
        <button class="primary" type="submit">进入</button>
      </form>
    </div>
  </section>

  <main id="app" class="hidden">
    <h1>子弹数据</h1>
    <p class="sub">填写新子弹，或在总览里点「修改」。提交后会出现在下方总览里，入库状态每 10 秒自动刷新。</p>

    <section class="card" id="formCard">
      <h2 id="formTitle">新增子弹</h2>
      <form id="bulletForm" autocomplete="off" novalidate>
        <label for="f_name">名称<span class="req">*</span></label>
        <input id="f_name" name="name" maxlength="40" required>
        <div id="dupHint" class="hint warn hidden"></div>

        <div class="row2">
          <div>
            <label for="f_type">类型</label>
            <input id="f_type" name="type" maxlength="20" list="typeList">
            <datalist id="typeList"></datalist>
          </div>
          <div>
            <label for="f_damage">伤害</label>
            <input id="f_damage" name="damage" maxlength="20" inputmode="decimal">
          </div>
        </div>

        <div class="row2">
          <div>
            <label for="f_rarity">稀有度</label>
            <input id="f_rarity" name="rarity" maxlength="20" list="rarityList">
            <datalist id="rarityList">
              <option value="普通"></option><option value="稀有"></option><option value="史诗"></option><option value="传说"></option>
            </datalist>
          </div>
          <div>
            <label for="f_school">流派</label>
            <input id="f_school" name="school" maxlength="20" list="schoolList">
            <datalist id="schoolList"></datalist>
          </div>
        </div>

        <label for="f_effect">效果说明</label>
        <textarea id="f_effect" name="effect" maxlength="1000"></textarea>

        <label for="f_notes">备注</label>
        <textarea id="f_notes" name="notes" maxlength="1000"></textarea>

        <div id="editNote" class="hint warn hidden">保存后会回到「未入库」，方便按新数据再做进游戏。</div>
        <div id="formErr" class="hint warn hidden"></div>
        <button class="primary" type="submit" id="submitBtn">提交到云端</button>
        <button type="button" id="cancelEdit" class="cancel hidden">取消修改</button>
        <div class="hint" id="submitHint">提交会打开 GitHub 确认页：需要已登录的 GitHub 账号，在那里点一次绿色的「Commit changes」按钮就算交上去了。</div>
      </form>
      <div id="submitNotice" class="notice hidden"></div>
    </section>

    <section class="card">
      <div class="bar">
        <h2>总览 <span id="count" class="status"></span></h2>
        <button class="small" id="refreshBtn" type="button">刷新</button>
      </div>
      <div id="syncStatus" class="status"><span class="dot"></span>正在读取…</div>
      <div class="tabs" id="tabs">
        <button type="button" data-f="all" class="on">全部</button>
        <button type="button" data-f="out">未入库</button>
        <button type="button" data-f="in">已入库</button>
      </div>
      <div class="filters">
        <label for="q">搜索</label>
        <input id="q" type="search" placeholder="搜索名称、类型、流派、效果、备注" enterkeyhint="search" autocapitalize="off" spellcheck="false">
        <div class="row2">
          <div>
            <label for="filterType">类型</label>
            <select id="filterType"><option value="">全部</option></select>
          </div>
          <div>
            <label for="filterRarity">稀有度</label>
            <select id="filterRarity"><option value="">全部</option></select>
          </div>
        </div>
        <div>
          <label for="filterSchool">流派</label>
          <select id="filterSchool"><option value="">全部</option></select>
        </div>
        <div class="row2">
          <div>
            <label for="sortKey">排序</label>
            <select id="sortKey">
              <option value="updated">更新时间</option>
              <option value="created">创建时间</option>
              <option value="name">名称</option>
              <option value="type">类型</option>
              <option value="school">流派</option>
              <option value="damage">伤害</option>
              <option value="rarity">稀有度</option>
            </select>
          </div>
          <div>
            <label for="sortDir">顺序</label>
            <select id="sortDir">
              <option value="desc">降序</option>
              <option value="asc">升序</option>
            </select>
          </div>
        </div>
      </div>
      <div id="list" class="list"></div>
    </section>
  </main>
</div>
<script src="app.js?v=6"></script>
</body>
</html>
