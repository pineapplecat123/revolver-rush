name: Bullet editor ingest

# Two ways a bullet reaches companion/bullet-editor/data.json on feat/gameplay-redo:
#  1) one-tap submit: /redo/bullets/ calls workflow_dispatch with inputs.bullet (JSON),
#     using a fine-grained token that only has Actions:write on this repo
#     (sealed with the page PIN in companion/bullet-editor/submit-key.json).
#     Dispatch can only ADD a new row (existing ids are ignored).
#  2) fallback: owner commits companion/bullet-editor/inbox/<id>.json.
# Pushes made with GITHUB_TOKEN do not re-trigger workflows (no loop, no Pages rebuild).
on:
  push:
    branches: [feat/gameplay-redo]
    paths: ['companion/bullet-editor/inbox/**']
  workflow_dispatch:
    inputs:
      bullet:
        description: 'Bullet JSON from the editor page'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/gameplay-redo
      - name: Merge into data.json
        env:
          BULLET_JSON: ${{ inputs.bullet }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin feat/gameplay-redo
            git reset --hard origin/feat/gameplay-redo
            python3 .github/scripts/bullet_editor_ingest.py
            git add -A companion/bullet-editor/data.json companion/bullet-editor/inbox
            if git diff --cached --quiet; then echo "nothing to merge"; exit 0; fi
            git commit -m "bullet-editor: ingest into data.json"
            if git push origin HEAD:feat/gameplay-redo; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
