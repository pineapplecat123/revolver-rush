name: Deploy Web to GitHub Pages

# Root site = main (v0.4.36+). /redo/ = feat/gameplay-redo Hand/倒出 preview.
# Actions Pages replaces the whole site each deploy, so every run rebuilds BOTH.
# feat/gameplay-redo cannot deploy to the github-pages environment (main-only branch
# policy). pushes to that branch kick workflow_dispatch on this workflow via
# pages-redo-kick.yml so /redo/ still auto-updates.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main (root site)
        uses: actions/checkout@v7
        with:
          ref: main
          path: main-src

      - name: Checkout feat/gameplay-redo (/redo/ preview)
        uses: actions/checkout@v7
        with:
          ref: feat/gameplay-redo
          path: redo-src

      - name: Cache Godot + export templates
        id: cache-godot
        uses: actions/cache@v6
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-web-${{ env.GODOT_VERSION }}-stable

      - name: Download Godot + export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot-bin
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot-bin/godot
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          tdir=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$tdir"
          unzip -q -j /tmp/templates.tpz 'templates/web_*' 'templates/version.txt' -d "$tdir"
          rm -f /tmp/templates.tpz
          ls -la "$tdir"

      - name: Install Godot
        run: |
          chmod +x ~/godot-bin/godot
          sudo ln -sf ~/godot-bin/godot /usr/local/bin/godot
          godot --version

      - name: Install fonttools for charset check
        run: pip install --user fonttools

      - name: Export main → site root
        working-directory: main-src
        run: |
          set -euo pipefail
          godot --headless --path . --import
          bash tools/pre_push_check.sh
          mkdir -p "$GITHUB_WORKSPACE/build/web"
          godot --headless --path . --export-release "Web" "$GITHUB_WORKSPACE/build/web/index.html"
          test -f "$GITHUB_WORKSPACE/build/web/index.html"
          HASH="$(git rev-parse --short HEAD)"
          cd "$GITHUB_WORKSPACE/build/web"
          mv index.js "index.${HASH}.js"
          mv index.wasm "index.${HASH}.wasm"
          mv index.pck "index.${HASH}.pck"
          sed -i "s/index\.wasm/index.${HASH}.wasm/g; s/index\.pck/index.${HASH}.pck/g" "index.${HASH}.js"
          sed -i "s/index\.js/index.${HASH}.js/g; s/\"executable\":\"index\"/\"executable\":\"index.${HASH}\"/g; s/index\.pck/index.${HASH}.pck/g; s/index\.wasm/index.${HASH}.wasm/g" index.html
          python3 "$GITHUB_WORKSPACE/main-src/tools/inject_web_clear_cache.py" index.html
          printf '%s\n' "build=${HASH}" "branch=main" > version.txt
          ls -la

      - name: Export feat/gameplay-redo → /redo/
        working-directory: redo-src
        run: |
          set -euo pipefail
          godot --headless --path . --import
          bash tools/pre_push_check.sh
          mkdir -p "$GITHUB_WORKSPACE/build/web/redo"
          godot --headless --path . --export-release "Web" "$GITHUB_WORKSPACE/build/web/redo/index.html"
          test -f "$GITHUB_WORKSPACE/build/web/redo/index.html"
          HASH="$(git rev-parse --short HEAD)"
          cd "$GITHUB_WORKSPACE/build/web/redo"
          mv index.js "index.${HASH}.js"
          mv index.wasm "index.${HASH}.wasm"
          mv index.pck "index.${HASH}.pck"
          sed -i "s/index\.wasm/index.${HASH}.wasm/g; s/index\.pck/index.${HASH}.pck/g" "index.${HASH}.js"
          sed -i "s/index\.js/index.${HASH}.js/g; s/\"executable\":\"index\"/\"executable\":\"index.${HASH}\"/g; s/index\.pck/index.${HASH}.pck/g; s/index\.wasm/index.${HASH}.wasm/g" index.html
          # Subfolder base so Godot asset paths resolve under /revolver-rush/redo/
          if ! grep -q '<base ' index.html; then
            sed -i 's|<head>|<head>\n<base href="/revolver-rush/redo/" />|' index.html
          fi
          python3 "$GITHUB_WORKSPACE/redo-src/tools/inject_web_clear_cache.py" index.html
          printf '%s\n' "build=${HASH}" "branch=feat/gameplay-redo" "preview=hand-dump" > version.txt
          # Tiny marker for HTTP checks (strings also live inside the pck)
          printf '%s\n' "倒出" "手" "自动装入" > preview_markers.txt
          ls -la
          ls -la "$GITHUB_WORKSPACE/build/web"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
