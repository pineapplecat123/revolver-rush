name: Kick Pages redo preview

# github-pages environment only allows deploys from main. On Hand/倒出 branch
# pushes, re-run the dual-build Pages workflow at ref main (root=main, /redo/=this branch).
on:
  push:
    branches: [feat/gameplay-redo]
    # Bullet-editor data is read live from the repo; no site rebuild needed.
    paths-ignore:
      - 'companion/bullet-editor/inbox/**'
      - 'companion/bullet-editor/data.json'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: pages-redo-kick
  cancel-in-progress: true

jobs:
  kick:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Deploy Web to GitHub Pages on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # GitHub occasionally returns HTTP 500 on workflow_dispatch; retry.
          for i in 1 2 3 4 5; do
            if gh workflow run "Deploy Web to GitHub Pages" \
              --repo "${GITHUB_REPOSITORY}" \
              --ref main; then
              echo "Dispatched Pages dual-build (root=main, /redo/=feat/gameplay-redo tip)."
              exit 0
            fi
            echo "Dispatch attempt ${i} failed; retrying..."
            sleep $((i * 10))
          done
          echo "Failed to dispatch Pages workflow after retries."
          exit 1
