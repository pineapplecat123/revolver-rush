<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: $GODOT_SPLASH_COLOR;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	inset: 0;
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
	z-index: 100;
}

#status-splash {
	position: relative;
	width: min(72vw, 280px);
	height: min(72vw, 280px);
	flex: 0 0 auto;
}

#status-splash.show-image--false {
	display: none;
}

#rr-cylinder-spin {
	position: absolute;
	inset: 0;
	width: 100%;
	height: 100%;
	transform-origin: 50% 50%;
	animation: rr-cylinder-spin 1.8s linear infinite;
}

#rr-cylinder-spin svg {
	display: block;
	width: 100%;
	height: 100%;
	overflow: visible;
}

@keyframes rr-cylinder-spin {
	from { transform: rotate(0deg); }
	to { transform: rotate(360deg); }
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	position: relative;
	width: min(70vw, 280px);
	height: 12px;
	margin: 28px 0 0 0;
	appearance: none;
	-webkit-appearance: none;
	border: 2px solid #737A8C;
	border-radius: 8px;
	background: #141418;
	overflow: hidden;
}

#status-progress::-webkit-progress-bar {
	background: #141418;
	border-radius: 6px;
}

#status-progress::-webkit-progress-value {
	background: #D4B45A;
	border-radius: 6px;
}

#status-progress::-moz-progress-bar {
	background: #D4B45A;
	border-radius: 6px;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 1rem 2rem 0;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<div id="status-splash" aria-hidden="true">
				<div id="rr-cylinder-spin">
					<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 244 244" width="244" height="244">
						<circle cx="122" cy="122" r="105" fill="#292C38" stroke="#737A8C" stroke-width="4"/>
						<circle cx="122" cy="122" r="96" fill="none" stroke="#3A3D48" stroke-width="2"/>
						<circle cx="122" cy="44" r="29" fill="#2E2E38" stroke="#666673" stroke-width="2"/>
						<circle cx="122" cy="44" r="20" fill="#141418"/>
						<circle cx="189.55" cy="83" r="29" fill="#2E2E38" stroke="#666673" stroke-width="2"/>
						<circle cx="189.55" cy="83" r="20" fill="#141418"/>
						<circle cx="189.55" cy="161" r="29" fill="#2E2E38" stroke="#666673" stroke-width="2"/>
						<circle cx="189.55" cy="161" r="20" fill="#141418"/>
						<circle cx="122" cy="200" r="29" fill="#2E2E38" stroke="#666673" stroke-width="2"/>
						<circle cx="122" cy="200" r="20" fill="#141418"/>
						<circle cx="54.45" cy="161" r="29" fill="#2E2E38" stroke="#666673" stroke-width="2"/>
						<circle cx="54.45" cy="161" r="20" fill="#141418"/>
						<circle cx="54.45" cy="83" r="29" fill="#2E2E38" stroke="#666673" stroke-width="2"/>
						<circle cx="54.45" cy="83" r="20" fill="#141418"/>
						<circle cx="122" cy="122" r="15" fill="#474D5C" stroke="#8C94A6" stroke-width="2"/>
						<circle cx="122" cy="122" r="4" fill="#2A2C32" stroke="#9AA0AA" stroke-width="1.2"/>
					</svg>
				</div>
			</div>
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
